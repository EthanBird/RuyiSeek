[package]
name = "ruyiseek-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
dbus = { version = "=0.9.7", features = ["vendored"] }
dbus-crossroads = "=0.5.2"
ksni = "=0.2.2"
libc = "=0.2.172"
ruyiseek-ipc = { path = "../../crates/ruyiseek-ipc" }
ruyiseek-platform = { path = "../../crates/ruyiseek-platform", features = ["x11"] }
serde = { version = "=1.0.229", features = ["derive"] }
slint = { version = "=1.6.0", default-features = false, features = [
    "backend-winit-wayland",
    "backend-winit-x11",
    "compat-1-2",
    "renderer-software",
    "std",
] }
toml = "=0.8.11"

[build-dependencies]
# `ksni` invokes `dbus-codegen` in the host dependency graph. Repeat the vendored feature here so
# Rust 1.75 builds do not require a host `pkg-config` executable or libdbus development headers.
dbus = { version = "=0.9.7", features = ["vendored"] }
slint-build = "=1.6.0"

# Slint 1.6 generated item-tree bindings contain audited internal unsafe blocks and emit their
# own `allow(unsafe_code)`. The rest of the workspace keeps `unsafe_code = "forbid"`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = "warn"
pedantic = "warn"
