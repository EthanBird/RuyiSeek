[workspace]
members = [
    "apps/ruyi-cli",
    "apps/ruyiseek-ui",
    "apps/ruyiseekd",
    "crates/ruyiseek-core",
    "crates/ruyiseek-index",
    "crates/ruyiseek-ipc",
    "crates/ruyiseek-platform",
    "crates/ruyiseek-query",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["RuyiSeek contributors"]
repository = "https://github.com/EthanBird/RuyiSeek"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Release profiles deliberately switch to `panic = "abort"`. The default
# `panic = "unwind"` pulls in `_Unwind_*` symbols whose only ABI-tagged
# (GCC_3.0) provider is `libgcc_s.so.1`, which the `libgcc-s1` package
# supplies on Debian-family hosts. See .cargo/config.toml for the rest
# of the libgcc_s removal strategy. Debug profiles keep unwinding so
# stack traces remain useful during development.
[profile.release]
panic = "abort"
opt-level = 3
