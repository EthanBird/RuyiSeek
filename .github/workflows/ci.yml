name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.75 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The repository default is the musl release target and carries release-only
    # linker flags. CI validates the workspace on the runner's native GNU target;
    # package builds select musl explicitly in packaging/deb/build.sh.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      RUSTFLAGS: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.75.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.75.0 fmt --all -- --check

      - name: Run tests
        run: cargo +1.75.0 test --workspace --locked

      - name: Run Clippy
        run: cargo +1.75.0 clippy --workspace --all-targets --locked -- -D warnings
