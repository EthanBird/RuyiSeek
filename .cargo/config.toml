# Keep the command-line client and daemon portable across the UOS 20 / Debian
# 10 glibc baseline by building them for Rust's self-contained musl target.
# These crates are pure Rust, so no host musl compiler, staged sysroot, shim
# object, or machine-specific absolute path is required.

[build]
target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "panic=abort",
    "-C", "link-arg=--as-needed",
]

# The UI is selected explicitly by packaging/deb/build.sh because Slint/winit
# needs glibc's working dlopen implementation for the X11 client libraries.
[target.x86_64-unknown-linux-gnu]
linker = "cc"
rustflags = [
    "-C", "panic=abort",
    "-C", "link-arg=-static-libgcc",
    # UOS ships patchelf 0.10, which corrupts this Rust PIE when changing
    # PT_INTERP or RPATH. Set a transitive DT_RPATH at link time instead.
    "-C", "link-arg=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib/ruyiseek",
]
